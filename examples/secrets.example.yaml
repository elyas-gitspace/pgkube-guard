# Copy to secrets.yaml at the repo root, fill in real values, then: kubectl apply -f secrets.yaml (gitignored)

# Credentials for the source Postgres, used by the backup job only (read-only user recommended)
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: pgkube-guard
type: Opaque
stringData:
  PGUSER: backup_user
  PGPASSWORD: change-me
---
# S3 write access for the backup job (Put / List / Delete)
apiVersion: v1
kind: Secret
metadata:
  name: s3-backup-credentials
  namespace: pgkube-guard
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: change-me
  AWS_SECRET_ACCESS_KEY: change-me
---
# S3 read-only access for the restore test (Get / List)
apiVersion: v1
kind: Secret
metadata:
  name: s3-restore-credentials
  namespace: pgkube-guard
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: change-me
  AWS_SECRET_ACCESS_KEY: change-me
---
# Notification targets, leave empty to disable
apiVersion: v1
kind: Secret
metadata:
  name: notifications
  namespace: pgkube-guard
type: Opaque
stringData:
  SLACK_WEBHOOK_URL: ""
  HEALTHCHECK_URL_BACKUP: ""
  HEALTHCHECK_URL_RESTORE: ""
