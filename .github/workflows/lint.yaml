# Lint and validate Kubernetes manifests on every push and pull request
name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  yamllint:
    name: YAML syntax and style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run yamllint
        run: |
          pip install --quiet yamllint
          yamllint --strict .

  kubeconform:
    name: Kubernetes schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - name: Validate manifests
        run: kubeconform -strict -summary -kubernetes-version 1.31.0 k8s/