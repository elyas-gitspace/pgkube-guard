apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: my-app
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          env:
            - { name: POSTGRES_DB, value: mydb }
            - { name: POSTGRES_USER, value: postgres }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: postgres-admin, key: POSTGRES_PASSWORD }
            - name: BACKUP_USER_PASSWORD
              valueFrom:
                secretKeyRef: { name: postgres-admin, key: BACKUP_USER_PASSWORD }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }   # subfolder, avoids lost+found
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d }
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "mydb"]
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { memory: 512Mi }
      volumes:
        - name: init
          configMap:
            name: postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi   # Hetzner Cloud volumes are rounded up to 10Gi
