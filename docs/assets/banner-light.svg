<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2fb"/>
      <stop offset="1" stop-color="#f8eef6"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="55"/></filter>
    <filter id="frost" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="95"/></filter>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.95"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1280" height="400" rx="28"/></clipPath>
    <clipPath id="card"><rect x="190" y="80" width="900" height="240" rx="36"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="400" fill="url(#bg)"/>
    <g filter="url(#soft)">
      <circle cx="250" cy="110" r="160" fill="#8fb8ff"/>
      <circle cx="1030" cy="310" r="180" fill="#f3a9de"/>
      <circle cx="690" cy="20" r="120" fill="#a6ecdc"/>
    </g>
    <g clip-path="url(#card)">
      <rect width="1280" height="400" fill="url(#bg)"/>
      <g filter="url(#frost)" opacity="0.85">
      <circle cx="250" cy="110" r="160" fill="#8fb8ff"/>
      <circle cx="1030" cy="310" r="180" fill="#f3a9de"/>
      <circle cx="690" cy="20" r="120" fill="#a6ecdc"/>
      </g>
      <rect x="190" y="80" width="900" height="240" fill="#ffffff" fill-opacity="0.45"/>
      <rect x="190" y="80" width="900" height="240" fill="url(#sheen)"/>
    </g>
    <rect x="190.75" y="80.75" width="898.5" height="238.5" rx="35.25" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
    <text x="640" y="182" text-anchor="middle" font-family="-apple-system, 'SF Pro Display', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="600" letter-spacing="-1.5" fill="#101217">pgkube-guard</text>
    <text x="640" y="230" text-anchor="middle" font-family="-apple-system, 'SF Pro Display', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="400" fill="#4b5160">Postgres backups on Kubernetes, restore-tested every night.</text>
    <g font-family="-apple-system, 'SF Pro Display', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#2a2f3b">
      <rect x="443.0" y="262" width="110" height="32" rx="16" fill="#ffffff" fill-opacity="0.55" stroke="#ffffff" stroke-opacity="0.8"/>
      <text x="498.0" y="283" text-anchor="middle">Helm chart</text>
      <rect x="565.0" y="262" width="150" height="32" rx="16" fill="#ffffff" fill-opacity="0.55" stroke="#ffffff" stroke-opacity="0.8"/>
      <text x="640.0" y="283" text-anchor="middle">S3 · MinIO</text>
      <rect x="727.0" y="262" width="110" height="32" rx="16" fill="#ffffff" fill-opacity="0.55" stroke="#ffffff" stroke-opacity="0.8"/>
      <text x="782.0" y="283" text-anchor="middle">Postgres</text>
    </g>
  </g>
</svg>
