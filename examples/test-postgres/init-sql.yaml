# Runs once, on the first start with an empty volume
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: my-app
data:
  01-schema.sql: |
    CREATE TABLE users (
      id         SERIAL PRIMARY KEY,
      email      TEXT NOT NULL UNIQUE,
      created_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );
    INSERT INTO users (email)
    SELECT 'user' || i || '@example.com' FROM generate_series(1, 1000) AS i;
  02-backup-user.sh: |
    #!/bin/sh
    # Read-only user used by pgkube-guard
    psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" <<SQL
    CREATE ROLE backup_user LOGIN PASSWORD '$BACKUP_USER_PASSWORD';
    GRANT pg_read_all_data TO backup_user;
    SQL
