{{- if not .Values.postgres.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pgkube-guard.postgresSecretName" . }}
  labels:
    {{- include "pgkube-guard.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.postgres.secretKeys.username }}: {{ required "postgres.username is required when postgres.existingSecret is empty" .Values.postgres.username | quote }}
  {{ .Values.postgres.secretKeys.password }}: {{ required "postgres.password is required when postgres.existingSecret is empty" .Values.postgres.password | quote }}
{{- end }}
{{- with .Values.storage.s3.backupCredentials }}
{{- if not .existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pgkube-guard.s3BackupSecretName" $ }}
  labels:
    {{- include "pgkube-guard.labels" $ | nindent 4 }}
type: Opaque
stringData:
  {{ .secretKeys.accessKeyId }}: {{ required "storage.s3.backupCredentials.accessKeyId is required when existingSecret is empty" .accessKeyId | quote }}
  {{ .secretKeys.secretAccessKey }}: {{ required "storage.s3.backupCredentials.secretAccessKey is required when existingSecret is empty" .secretAccessKey | quote }}
{{- end }}
{{- end }}
{{- if .Values.restoreTest.enabled }}
{{- with .Values.storage.s3.restoreCredentials }}
{{- if not .existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pgkube-guard.s3RestoreSecretName" $ }}
  labels:
    {{- include "pgkube-guard.labels" $ | nindent 4 }}
type: Opaque
stringData:
  {{ .secretKeys.accessKeyId }}: {{ required "storage.s3.restoreCredentials.accessKeyId is required when existingSecret is empty" .accessKeyId | quote }}
  {{ .secretKeys.secretAccessKey }}: {{ required "storage.s3.restoreCredentials.secretAccessKey is required when existingSecret is empty" .secretAccessKey | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- if not .Values.notifications.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pgkube-guard.notificationsSecretName" . }}
  labels:
    {{- include "pgkube-guard.labels" . | nindent 4 }}
type: Opaque
stringData:
  SLACK_WEBHOOK_URL: {{ .Values.notifications.slackWebhookUrl | quote }}
  HEALTHCHECK_URL_BACKUP: {{ .Values.notifications.healthcheck.backupUrl | quote }}
  HEALTHCHECK_URL_RESTORE: {{ .Values.notifications.healthcheck.restoreUrl | quote }}
{{- end }}
