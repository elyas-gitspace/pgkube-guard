# Values utilisées par la CI : mode classique (backup pg_dump intégré + vérification)
postgres:
  host: postgres.my-app.svc.cluster.local
  database: mydb
  username: backup_user
  password: ci-password
storage:
  s3:
    bucket: ci-bucket
    backupCredentials:
      accessKeyId: ci-key
      secretAccessKey: ci-secret
    verifyCredentials:
      accessKeyId: ci-key
      secretAccessKey: ci-secret
metrics:
  pushgatewayUrl: http://pushgateway.monitoring.svc:9091
