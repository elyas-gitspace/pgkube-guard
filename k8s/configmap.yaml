# Non-secret settings, future values.yaml of the Helm chart
apiVersion: v1
kind: ConfigMap
metadata:
  name: pg-backup-config
  namespace: pg-backup
data:
  # Source database (in-cluster DNS, RDS endpoint or VM IP)
  PGHOST: postgres.my-app.svc.cluster.local
  PGPORT: "5432"
  PGDATABASE: mydb
  PGSSLMODE: prefer                           # use "require" for RDS

  # Storage
  S3_BUCKET: my-backups
  S3_PREFIX: "pg-backup-kit/"
  AWS_DEFAULT_REGION: eu-west-3
  # AWS_ENDPOINT_URL: http://minio.minio.svc.cluster.local:9000   # uncomment for MinIO / S3-compatible

  # Retention
  RETENTION: "7"                              # number of dumps to keep

  # Restore test
  CHECK_QUERY: "SELECT COUNT(*) FROM users"   # must return a number > 0

  # Notifications
  NOTIFY_ON_SUCCESS: "false"                  # also notify on success
