# Lint and validate the Helm chart on every push and pull request
name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  yamllint:
    name: YAML syntax and style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run yamllint
        run: |
          pip install --quiet yamllint
          yamllint --strict .

  helm:
    name: Helm lint and schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      # Chaque fichier de ci/ est un scénario (pgdump, wal-g...) : on les lint et valide tous
      - name: Helm lint
        run: |
          for f in charts/pgkube-guard/ci/*.yaml; do
            echo "::group::$f"
            helm lint charts/pgkube-guard -f "$f" --strict
            echo "::endgroup::"
          done

      - name: Render and validate manifests
        run: |
          for f in charts/pgkube-guard/ci/*.yaml; do
            echo "::group::$f"
            helm template my-backup charts/pgkube-guard -f "$f" \
              | kubeconform -strict -summary -kubernetes-version 1.31.0
            echo "::endgroup::"
          done
