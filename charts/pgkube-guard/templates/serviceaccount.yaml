{{- if .Values.serviceAccount.create }}
# Job pods never call the Kubernetes API, so no token is mounted
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pgkube-guard.serviceAccountName" . }}
  labels:
    {{- include "pgkube-guard.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
