{{- /* Le chart ne crée un Secret que si l'utilisateur n'en fournit pas un existant (existingSecret) */}}
{{- $verifyEnabled := or .Values.verify.freshness.enabled .Values.verify.restoreDrill.enabled }}
{{- if and .Values.backup.enabled (not .Values.postgres.existingSecret) }}
# Identifiants Postgres de prod, utilisés uniquement par le backup intégré
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pgkube-guard.postgresSecretName" . }}
  labels:
    {{- include "pgkube-guard.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.postgres.secretKeys.username }}: {{ required "postgres.username is required when postgres.existingSecret is empty" .Values.postgres.username | quote }}
  {{ .Values.postgres.secretKeys.password }}: {{ required "postgres.password is required when postgres.existingSecret is empty" .Values.postgres.password | quote }}
{{- end }}
{{- if .Values.backup.enabled }}
{{- with .Values.storage.s3.backupCredentials }}
{{- if not .existingSecret }}
---
# Clés S3 en écriture, pour le backup intégré
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pgkube-guard.s3BackupSecretName" $ }}
  labels:
    {{- include "pgkube-guard.labels" $ | nindent 4 }}
type: Opaque
stringData:
  {{ .secretKeys.accessKeyId }}: {{ required "storage.s3.backupCredentials.accessKeyId is required when existingSecret is empty" .accessKeyId | quote }}
  {{ .secretKeys.secretAccessKey }}: {{ required "storage.s3.backupCredentials.secretAccessKey is required when existingSecret is empty" .secretAccessKey | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- if $verifyEnabled }}
{{- with .Values.storage.s3.verifyCredentials }}
{{- if not .existingSecret }}
---
# Clés S3 en lecture seule, pour le freshness check et le restore drill
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pgkube-guard.s3VerifySecretName" $ }}
  labels:
    {{- include "pgkube-guard.labels" $ | nindent 4 }}
type: Opaque
stringData:
  {{ .secretKeys.accessKeyId }}: {{ required "storage.s3.verifyCredentials.accessKeyId is required when existingSecret is empty" .accessKeyId | quote }}
  {{ .secretKeys.secretAccessKey }}: {{ required "storage.s3.verifyCredentials.secretAccessKey is required when existingSecret is empty" .secretAccessKey | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- if not .Values.notifications.existingSecret }}
---
# Cibles des notifications (vides = désactivées)
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pgkube-guard.notificationsSecretName" . }}
  labels:
    {{- include "pgkube-guard.labels" . | nindent 4 }}
type: Opaque
stringData:
  SLACK_WEBHOOK_URL: {{ .Values.notifications.slackWebhookUrl | quote }}
  HEALTHCHECK_URL_BACKUP: {{ .Values.notifications.healthcheck.backupUrl | quote }}
  HEALTHCHECK_URL_FRESHNESS: {{ .Values.notifications.healthcheck.freshnessUrl | quote }}
  HEALTHCHECK_URL_RESTORE: {{ .Values.notifications.healthcheck.restoreUrl | quote }}
{{- end }}
